# 사용법 두 가지 (자세한 절차는 docs/CLOUD_DB.md)
#
#  1) 클라우드 DB에 붙기 (여러 컴퓨터가 같은 데이터를 쓸 때)
#       .env 에 DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD 를 적고  ->  docker compose up --build
#       (mysql 서비스는 profile "local-db" 라 기본으로는 뜨지 않는다)
#
#  2) 컴퓨터 안의 도커 MySQL 쓰기 (혼자 실험할 때 - 이 DB는 그 컴퓨터에만 있다)
#       docker compose --profile local-db up --build   (.env 에 DB_* 를 적지 않는다)

services:
  mysql:
    profiles: ["local-db"]
    image: mysql:8.0
    container_name: chok-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-chokDockerTest123}
      MYSQL_DATABASE: chok
    ports:
      # 호스트 3306은 로컬에 이미 떠 있는 네이티브 MySQL이 점유 중 (충돌 확인됨) → 3307로 매핑.
      # 컨테이너 간 통신(app -> mysql:3306)은 도커 내부 네트워크를 쓰므로 이 매핑과 무관하게 정상 동작.
      - "3307:3306"
    volumes:
      - chok-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-chokDockerTest123}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chok-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
        required: false      # local-db profile 을 켰을 때만 기다린다 (클라우드 DB 모드에선 mysql 이 없다)
    ports:
      - "8080:8080"
    environment:
      # DB 접속 정보: Spring(JDBC)과 python-collector(db.py)가 같은 DB_* 값을 본다.
      # 기본값은 같이 뜨는 도커 MySQL. 클라우드 DB는 TLS 필수라 DB_SSL_MODE=REQUIRED 로 둔다.
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-chok}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_ROOT_PASSWORD:-chokDockerTest123}}
      # Spring Boot (application.properties의 spring.datasource.* 를 오버라이드)
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST:-mysql}:${DB_PORT:-3306}/${DB_NAME:-chok}?sslMode=${DB_SSL_MODE:-DISABLED}&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-${MYSQL_ROOT_PASSWORD:-chokDockerTest123}}
      CHOK_OPENAI_API_KEY: ${CHOK_OPENAI_API_KEY:-CHANGE_ME}
      CHOK_ANTHROPIC_API_KEY: ${CHOK_ANTHROPIC_API_KEY:-CHANGE_ME}
      CHOK_SENTIMENT_PROVIDER: ${CHOK_SENTIMENT_PROVIDER:-openai}
      # 여러 컴퓨터가 같은 DB를 볼 때 자동 수집·분석은 한 곳에서만 켠다 (중복 실행·데드락 방지).
      # 켜는 컴퓨터의 .env 에만 CHOK_SCHEDULER_ENABLED=true 를 적는다.
      CHOK_SCHEDULER_ENABLED: ${CHOK_SCHEDULER_ENABLED:-false}
      # python-collector (db.py가 os.environ에서 직접 읽음, ProcessBuilder가
      # 부모 프로세스인 이 컨테이너의 환경변수를 그대로 상속함 - 위 DB_* 가 그대로 전달된다)

volumes:
  chok-mysql-data:
