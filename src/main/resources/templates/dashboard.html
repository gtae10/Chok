<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>촉 - 주식 스크리너</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

<header class="topbar">
    <div class="topbar__inner">
        <span class="brand">촉<em>Chok</em></span>
        <div class="topbar__meta">
            <span id="lastUpdated" class="meta-pill">기준일 확인 중...</span>
            <input type="text" id="searchInput" class="search-input" placeholder="종목명 또는 티커 검색...">
            <a th:href="@{/performance}" class="btn-ghost">실전 성과</a>
            <button id="collectBtn" class="btn-ghost">① 시세 수집</button>
            <button id="analyzeBtn" class="btn-ghost btn-primary">② 분석 실행</button>
        </div>
    </div>
</header>

<main class="layout">

    <div id="staleDataBanner" class="stale-banner" hidden></div>

    <div class="filters" style="margin-top: 24px;">
        <button class="filter-chip is-active" data-filter="">전체</button>
        <button class="filter-chip" data-filter="STRONG_BUY">적극 매수</button>
        <button class="filter-chip" data-filter="BUY">매수</button>
        <button class="filter-chip" data-filter="HOLD">중립</button>
        <button class="filter-chip" data-filter="SELL">매도</button>
        <button class="filter-chip" data-filter="STRONG_SELL">적극 매도</button>
    </div>

    <div class="table-wrap">
        <table class="stock-table">
            <thead>
            <tr>
                <th>#</th>
                <th class="sortable" data-sort="name">종목명<span class="sort-arrow"></span></th>
                <th>시장</th>
                <th class="sortable" data-sort="technicalScore">기술점수<span class="sort-arrow"></span></th>
                <th class="sortable" data-sort="sentimentScore">감성점수<span class="sort-arrow"></span></th>
                <th class="sortable" data-sort="finalScore">종합점수<span class="sort-arrow"></span></th>
                <th title="예측이 아니라 지금 상태를 나타내는 사실 태그입니다. 각 태그에 마우스를 올리면 정의가 나옵니다.">태그</th>
                <th class="sortable" data-sort="momentum12m" title="12-1개월 모멘텀: 약 1년 전부터 1개월 전까지의 주가 수익률(최근 1개월 제외). 과거 5년 검증에서 상위 종목이 하위 종목보다 더 오른 경향이 있었지만 구간별로 흔들려, 점수 계산에는 넣지 않은 참고 지표입니다.">12-1 모멘텀<span class="sort-arrow"></span></th>
                <th>추천</th>
            </tr>
            </thead>
            <tbody id="stockTableBody">
            <tr class="loading-row"><td colspan="9">데이터를 불러오는 중...</td></tr>
            </tbody>
        </table>
        <div id="emptyState" class="empty-state" hidden>
            <p>분석된 데이터가 없습니다.</p>
            <p>① 시세 수집 → ② 분석 실행 버튼을 순서대로 눌러주세요.</p>
        </div>
    </div>

    <p class="prob-caveat">
        점수와 태그는 참고용 정보이며 예측이 아닙니다. 태그별 실제 성과는 기록이 쌓이는 대로 검증합니다.
    </p>

    <div id="statusMsg" class="status-msg" hidden></div>

    <section id="tagGlossary" class="chart-section"></section>

</main>

<footer class="footer">
    <p>본 서비스의 점수와 추천 등급은 참고용 보조 지표이며, 수익을 보장하지 않습니다. 모든 투자 판단과 책임은 사용자 본인에게 있습니다.</p>
</footer>

<script th:src="@{/js/tags.js}"></script>
<script th:src="@{/js/dashboard.js}"></script>
<script th:src="@{/js/feedback-widget.js}"></script>
</body>
</html>
